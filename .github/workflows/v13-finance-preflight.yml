name: V13 Finance Preflight
on:
  push:
    branches: [feature/v13-finance-preflight-20261015]
  pull_request:
    paths:
      - 'app/Services/DutyHistoricalRate.php'
      - 'tests/duty_historical_rate_test.php'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: |
          php -l app/Services/DutyHistoricalRate.php
          php -l tests/duty_historical_rate_test.php
          php tests/duty_historical_rate_test.php
          php tests/duty_validation_test.php
          php tests/security_v11_test.php
